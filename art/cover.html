<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #1E293B 0%, #0F172A 55%, #020617 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #A8C6FB; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #2F6FE4; box-shadow: 0 0 18px #2F6FE4; }
  h1 { font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#A8C6FB,#6BA0FF); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #CBD5E1; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #A8C6FB; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #2F6FE447, transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Inline Edit</span></h1>
      <p class="sub">Double-click the text on the live page, type, save. No control panel, no page builder.</p>
      <div class="badges">
        <span class="badge">On the real page</span>
        <span class="badge">Visitors see nothing</span>
        <span class="badge">Not a page builder</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2F6FE4"/><stop offset="1" stop-color="#0B2A6B"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B2A6B" flood-opacity="0.32"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- A page with a text cursor standing in it, not a pencil. Portrait,
       because a landscape white card is what Payments already looks like,
       and the caret is the second largest shape rather than a detail:
       at 24 pixels it is the only element that means "edit". -->
  <g filter="url(#sh)">
    <rect x="116" y="86" width="280" height="340" rx="30" fill="#FFFFFF"/>
  </g>
  <rect x="152" y="136" width="120" height="24" rx="12" fill="url(#bg)"/>
  <rect x="152" y="186" width="146" height="24" rx="12" fill="url(#bg)"/>
  <rect x="152" y="236" width="88" height="24" rx="12" fill="url(#bg)"/>
  <rect x="334" y="130" width="32" height="252" rx="8" fill="url(#bg)"/>
  <rect x="312" y="130" width="76" height="24" rx="12" fill="url(#bg)"/>
  <rect x="312" y="358" width="76" height="24" rx="12" fill="url(#bg)"/>
      </svg>
    </div>
  </div>
</body>
</html>
