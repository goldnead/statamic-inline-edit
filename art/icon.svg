<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F6FE4"/>
      <stop offset="1" stop-color="#0B2A6B"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B2A6B" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- The blue is not a mood. #2F6FE4 is the ring this addon draws around an
       editable field, so the icon is the colour of the thing on screen.

       A page with a text cursor standing in it, not a pencil: a pencil says
       "somewhere there is a form", and the whole point here is that the text
       itself is the form.

       Two things are deliberate about the proportions, and both were wrong in
       the first draft. The sheet is portrait, because a landscape white card
       with punched-out bars is what Payments already looks like and the two
       sit next to each other in the docs grid. And the caret is the second
       largest shape rather than a detail: a 12px stem read as a speck at 24
       pixels, which is the size that decides whether an icon says anything at
       all. The caret is the only element that means "edit", so it has to be
       the one that survives. -->
  <g filter="url(#sh)">
    <rect x="116" y="86" width="280" height="340" rx="30" fill="#FFFFFF"/>
  </g>

  <rect x="152" y="136" width="120" height="24" rx="12" fill="url(#bg)"/>
  <rect x="152" y="186" width="146" height="24" rx="12" fill="url(#bg)"/>
  <rect x="152" y="236" width="88" height="24" rx="12" fill="url(#bg)"/>

  <!-- the caret, standing in the page -->
  <rect x="334" y="130" width="32" height="252" rx="8" fill="url(#bg)"/>
  <rect x="312" y="130" width="76" height="24" rx="12" fill="url(#bg)"/>
  <rect x="312" y="358" width="76" height="24" rx="12" fill="url(#bg)"/>
</svg>
